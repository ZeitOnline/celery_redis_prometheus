name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    # TODO: pin to the gh-action-workflows release that contains pypi-release
    uses: zeitonline/gh-action-workflows/.github/workflows/pypi-release.yaml@0167ccffbb2ff3c0b3a53a2205f10a85007ff73e
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
    with:
      slack-channel: C06JB4PMALW  # team-content-alerts
