name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: zeitonline/gh-action-workflows/.github/workflows/pypi-release.yaml@6e29b53abe92baa48d4e00ca560d27f59991e8d3 # 4.10.2
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
    with:
      slack-channel: C06JB4PMALW  # team-content-alerts
