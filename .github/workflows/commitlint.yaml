name: Commit lint

# Release Please derives version and changelog from conventional commits
# and silently leaves out any other message
on:
  push:
    branches-ignore:
      - main

jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@7c0cccffb89e545f3c37312433c7810432107003 # 4.7.3
