name: Commit lint

# Release Please derives version and changelog from conventional commits
# and silently leaves out any other message
on:
  push:
    branches-ignore:
      - main

jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@6e29b53abe92baa48d4e00ca560d27f59991e8d3 # 4.10.2
