name: Commit lint

# Release Please only releases fix, feat and deps commits,
# so other messages would silently skip a release
on:
  push:
    branches-ignore:
      - main

jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@a07f66af60d78de3727d1a6ba78d3bb027b627df # 4.8.0
