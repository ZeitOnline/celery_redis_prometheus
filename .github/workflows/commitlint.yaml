name: Commit lint

# Release Please derives version and changelog from conventional commits
# and silently leaves out any other message
on:
  push:
    branches-ignore:
      - main

jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@b19340fe2799d806acba988c59a2213eb3771971 # 4.10.1
